<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Animal Scoreboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FDF6E3;
      --bg-secondary: #F5E6C8;
      --fg: #2D1B0E;
      --muted: #8B7355;
      --accent: #E07B39;
      --accent-hover: #C86A2E;
      --card: #FFFFFF;
      --border: #D4A574;
      --glow: rgba(224, 123, 57, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      margin: 0;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    .font-display { font-family: 'Bebas Neue', sans-serif; }

    .bg-pattern {
      background-image: 
        radial-gradient(circle at 20% 80%, var(--glow) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, var(--glow) 0%, transparent 50%);
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }

    .btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.2s ease;
      border-radius: 8px;
    }

    .btn:active { transform: scale(0.96); }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { filter: brightness(1.1); }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--fg);
      border: 2px solid var(--border);
    }
    .btn-secondary:hover { filter: brightness(0.95); }

    .btn-danger { background: #DC2626; color: white; }
    .btn-danger:hover { filter: brightness(1.1); }

    .btn-success { background: #16A34A; color: white; }
    .btn-success:hover { filter: brightness(1.1); }

    .timer-display {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      color: var(--fg);
      letter-spacing: 2px;
    }

    .shotclock-display {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 700;
      color: var(--accent);
      min-width: 2.5rem;
    }

    .score-display {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .stat-value {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 700;
      color: var(--fg);
    }

    .period-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      max-width: 200px;
      margin: 0 auto;
    }

    .period-indicator {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .period-indicator.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .animal-icon { transition: transform 0.3s ease; }
    .animal-icon:hover { transform: scale(1.1) rotate(5deg); }
    .animal-icon svg { width: 60px; height: 40px; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .timer-running { animation: pulse 1s ease-in-out infinite; }

    .timeout-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      transition: all 0.3s ease;
    }
    .timeout-dot.used {
      background: var(--bg-secondary);
      border: 2px solid var(--border);
    }

    /* Penalty Shootout Styles */
    .pk-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pk-dot.made { background: #16A34A; border-color: #16A34A; }
    .pk-dot.missed { background: #DC2626; border-color: #DC2626; }

    select {
      background: var(--card);
      color: var(--fg);
      border: 2px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    select:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .format-select {
      padding: 2px 6px;
      font-size: 0.8rem;
      margin-bottom: 6px;
      background: var(--bg-secondary);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal-content {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-content { transform: scale(1); }

  </style>
</head>
<body class="bg-pattern">
  <div class="min-h-screen py-6 px-4">
    <div class="max-w-5xl mx-auto">
      
      <header class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <div class="flex items-center gap-3">
          <div id="animal-icon-container" class="animal-icon"></div>
          <div>
            <h1 class="font-display text-3xl tracking-wide" style="color: var(--fg);">
              <span id="title-text">Standard Bearded Dragon</span> Scoreboard
            </h1>
          </div>
        </div>
        
        <div class="flex gap-2 flex-wrap items-center">
          <select id="category-select" aria-label="Select Animal Category">
            <option value="lizard">Lizards</option>
            <option value="turtle">Turtles</option>
            <option value="tortoise">Tortoises</option>
            <option value="dog">Dogs</option>
            <option value="cat">Cats</option>
            <option value="bird">Birds</option>
            <option value="fish">Fish & Aquatic</option>
            <option value="snake">Snakes</option>
            <option value="more">More Animals</option>
          </select>
          <select id="breed-select" aria-label="Select Breed">
            </select>
        </div>
      </header>

      <div class="card p-4 mb-6">
        <div class="flex flex-wrap justify-center items-center gap-8">
          <div class="text-center">
            <div class="text-sm font-semibold mb-1" style="color: var(--muted);">GAME TIME</div>
            <div id="game-timer" class="timer-display">12:00</div>
            <div class="flex gap-2 mt-2 justify-center">
              <button id="timer-start" class="btn btn-success px-4 py-2 text-sm">Start</button>
              <button id="timer-stop" class="btn btn-danger px-4 py-2 text-sm">Stop</button>
              <button id="timer-set" class="btn btn-secondary px-4 py-2 text-sm">Set</button>
            </div>
          </div>
          
          <div class="text-center flex flex-col items-center">
            <div class="flex items-center gap-2 mb-1">
              <div class="text-sm font-semibold" style="color: var(--muted);">PERIOD:</div>
              <select id="game-format" class="format-select">
                <option value="quarters">Quarters (4)</option>
                <option value="halves">Halves (2)</option>
                <option value="periods">Periods (3)</option>
                <option value="innings">Innings (9)</option>
              </select>
            </div>
            <div id="period-container" class="period-container">
              </div>
            <div class="flex flex-col gap-2 mt-2 items-center">
              <div class="flex gap-2">
                <button id="period-prev" class="btn btn-secondary px-3 py-1 text-sm">Prev</button>
                <button id="period-next" class="btn btn-secondary px-3 py-1 text-sm">Next</button>
              </div>
              <button id="penalty-toggle" class="btn btn-secondary px-3 py-1 text-xs">Penalty Shootout: Off</button>
            </div>
          </div>
          
          <div class="text-center">
            <div class="text-sm font-semibold mb-1" style="color: var(--muted);">SHOT CLOCK</div>
            <div id="shotclock" class="shotclock-display">24</div>
            <div class="flex gap-2 mt-2 justify-center">
              <button id="shotclock-reset" class="btn btn-primary px-3 py-1 text-sm">Reset 24</button>
              <button id="shotclock-14" class="btn btn-secondary px-3 py-1 text-sm">Reset 14</button>
              <button id="shotclock-toggle" class="btn btn-danger px-3 py-1 text-sm">Off</button>
            </div>
          </div>
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-6 mb-6">
        <div class="card p-6">
          <div class="flex justify-between items-center mb-4">
            <input type="text" id="team1-name" value="Home Team" class="text-xl font-bold bg-transparent border-b-2 border-transparent focus:border-current outline-none w-full" style="color: var(--fg);">
            <button onclick="clearTeamStat(1, 'score')" class="btn btn-secondary px-2 py-1 text-xs ml-2">Clear Score</button>
          </div>
          <div class="text-center mb-4"><div id="team1-score" class="score-display">0</div></div>
          <div class="flex justify-center gap-2 mb-6">
            <button onclick="changeScore(1, -1)" class="btn btn-primary w-12 h-12 text-xl">-</button>
            <button onclick="changeScore(1, 1)" class="btn btn-primary w-12 h-12 text-xl">+1</button>
            <button onclick="changeScore(1, 2)" class="btn btn-primary w-12 h-12 text-xl">+2</button>
            <button onclick="changeScore(1, 3)" class="btn btn-primary w-12 h-12 text-xl">+3</button>
          </div>
          <div class="flex justify-between items-center p-3 rounded-lg mb-3" style="background: var(--bg-secondary);">
            <div><span class="font-semibold">Fouls / Errors:</span><span id="team1-fouls" class="stat-value ml-2">0</span></div>
            <div class="flex gap-2">
              <button onclick="changeFouls(1, -1)" class="btn btn-secondary w-8 h-8 text-sm">-</button>
              <button onclick="changeFouls(1, 1)" class="btn btn-secondary w-8 h-8 text-sm">+</button>
              <button onclick="clearTeamStat(1, 'fouls')" class="btn btn-danger w-8 h-8 text-xs">C</button>
            </div>
          </div>
          <div class="flex justify-between items-center p-3 rounded-lg" style="background: var(--bg-secondary);">
            <div>
              <span class="font-semibold">Timeouts:</span>
              <div id="team1-timeouts-dots" class="flex gap-1 mt-1"><div class="timeout-dot"></div><div class="timeout-dot"></div><div class="timeout-dot"></div></div>
            </div>
            <div class="flex gap-2">
              <button onclick="changeTimeouts(1, -1)" class="btn btn-secondary w-8 h-8 text-sm">-</button>
              <button onclick="changeTimeouts(1, 1)" class="btn btn-secondary w-8 h-8 text-sm">+</button>
              <button onclick="clearTeamStat(1, 'timeouts')" class="btn btn-danger w-8 h-8 text-xs">C</button>
            </div>
          </div>
          <div id="team1-penalties-container" class="hidden flex flex-col p-3 rounded-lg mt-3" style="background: var(--bg-secondary);">
            <div class="flex justify-between items-center mb-2">
              <span class="font-semibold">Penalty Shootout</span>
              <div class="flex gap-2">
                <button onclick="addPenalty(1)" class="btn btn-secondary px-2 py-1 text-xs">+ Kick</button>
                <button onclick="clearTeamStat(1, 'penalties')" class="btn btn-danger px-2 py-1 text-xs">Clear</button>
              </div>
            </div>
            <div id="team1-penalties" class="flex flex-wrap gap-2 justify-center mt-1"></div>
          </div>
        </div>
        
        <div class="card p-6">
          <div class="flex justify-between items-center mb-4">
            <input type="text" id="team2-name" value="Away Team" class="text-xl font-bold bg-transparent border-b-2 border-transparent focus:border-current outline-none w-full" style="color: var(--fg);">
            <button onclick="clearTeamStat(2, 'score')" class="btn btn-secondary px-2 py-1 text-xs ml-2">Clear Score</button>
          </div>
          <div class="text-center mb-4"><div id="team2-score" class="score-display">0</div></div>
          <div class="flex justify-center gap-2 mb-6">
            <button onclick="changeScore(2, -1)" class="btn btn-primary w-12 h-12 text-xl">-</button>
            <button onclick="changeScore(2, 1)" class="btn btn-primary w-12 h-12 text-xl">+1</button>
            <button onclick="changeScore(2, 2)" class="btn btn-primary w-12 h-12 text-xl">+2</button>
            <button onclick="changeScore(2, 3)" class="btn btn-primary w-12 h-12 text-xl">+3</button>
          </div>
          <div class="flex justify-between items-center p-3 rounded-lg mb-3" style="background: var(--bg-secondary);">
            <div><span class="font-semibold">Fouls / Errors:</span><span id="team2-fouls" class="stat-value ml-2">0</span></div>
            <div class="flex gap-2">
              <button onclick="changeFouls(2, -1)" class="btn btn-secondary w-8 h-8 text-sm">-</button>
              <button onclick="changeFouls(2, 1)" class="btn btn-secondary w-8 h-8 text-sm">+</button>
              <button onclick="clearTeamStat(2, 'fouls')" class="btn btn-danger w-8 h-8 text-xs">C</button>
            </div>
          </div>
          <div class="flex justify-between items-center p-3 rounded-lg" style="background: var(--bg-secondary);">
            <div>
              <span class="font-semibold">Timeouts:</span>
              <div id="team2-timeouts-dots" class="flex gap-1 mt-1"><div class="timeout-dot"></div><div class="timeout-dot"></div><div class="timeout-dot"></div></div>
            </div>
            <div class="flex gap-2">
              <button onclick="changeTimeouts(2, -1)" class="btn btn-secondary w-8 h-8 text-sm">-</button>
              <button onclick="changeTimeouts(2, 1)" class="btn btn-secondary w-8 h-8 text-sm">+</button>
              <button onclick="clearTeamStat(2, 'timeouts')" class="btn btn-danger w-8 h-8 text-xs">C</button>
            </div>
          </div>
          <div id="team2-penalties-container" class="hidden flex flex-col p-3 rounded-lg mt-3" style="background: var(--bg-secondary);">
            <div class="flex justify-between items-center mb-2">
              <span class="font-semibold">Penalty Shootout</span>
              <div class="flex gap-2">
                <button onclick="addPenalty(2)" class="btn btn-secondary px-2 py-1 text-xs">+ Kick</button>
                <button onclick="clearTeamStat(2, 'penalties')" class="btn btn-danger px-2 py-1 text-xs">Clear</button>
              </div>
            </div>
            <div id="team2-penalties" class="flex flex-wrap gap-2 justify-center mt-1"></div>
          </div>
        </div>
      </div>

      <div class="card p-4 mb-6">
        <div class="text-sm font-semibold mb-3 text-center" style="color: var(--muted);">CLEAR INDIVIDUAL STATS</div>
        <div class="flex flex-wrap justify-center gap-3">
          <button onclick="clearAllScores()" class="btn btn-danger px-4 py-2 text-sm">Clear All Scores</button>
          <button onclick="clearAllFouls()" class="btn btn-danger px-4 py-2 text-sm">Clear All Fouls</button>
          <button onclick="clearAllTimeouts()" class="btn btn-danger px-4 py-2 text-sm">Clear All Timeouts</button>
          <button onclick="clearPeriod()" class="btn btn-danger px-4 py-2 text-sm">Clear Period</button>
          <button onclick="clearTimer()" class="btn btn-danger px-4 py-2 text-sm">Clear Timer</button>
          <button onclick="clearShotClock()" class="btn btn-danger px-4 py-2 text-sm">Clear Shot Clock</button>
        </div>
      </div>

      <div class="text-center">
        <button onclick="showResetModal()" class="btn btn-danger px-6 py-3 text-sm font-bold">RESET ENTIRE GAME</button>
      </div>

    </div>
  </div>

  <div id="reset-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 class="font-display text-2xl mb-4" style="color: var(--fg);">Reset Entire Game?</h3>
      <p class="mb-6" style="color: var(--muted);">This will clear all scores, fouls, timeouts, reset the timer and shot clock.</p>
      <div class="flex gap-3 justify-end">
        <button onclick="closeResetModal()" class="btn btn-secondary px-4 py-2">Cancel</button>
        <button onclick="resetAll()" class="btn btn-danger px-4 py-2">Reset Everything</button>
      </div>
    </div>
  </div>

  <script>
    // --- Dynamic SVG Template Generators ---
    const svgLizard = (c) => `<svg viewBox="0 0 120 80"><ellipse cx="60" cy="50" rx="40" ry="20" fill="${c.accent}"/><path d="M30 45 L35 35 L40 45 L45 32 L50 45 L55 30 L60 45 L65 30 L70 45 L75 32 L80 45 L85 35 L90 45" fill="${c.border}"/><ellipse cx="95" cy="48" rx="16" ry="12" fill="${c.bg2}"/><circle cx="100" cy="45" r="4" fill="${c.fg}"/></svg>`;
    const svgTurtle = (c) => `<svg viewBox="0 0 120 80"><ellipse cx="55" cy="45" rx="35" ry="25" fill="${c.muted}"/><ellipse cx="55" cy="45" rx="28" ry="20" fill="${c.accent}"/><path d="M55 25 L55 65 M35 35 Q55 50 75 35 M35 55 Q55 40 75 55" stroke="${c.border}" stroke-width="2"/><ellipse cx="95" cy="50" rx="14" ry="11" fill="${c.muted}"/><circle cx="100" cy="47" r="3.5" fill="${c.fg}"/></svg>`;
    const svgDog = (c) => `<svg viewBox="0 0 120 80"><ellipse cx="60" cy="48" rx="35" ry="22" fill="${c.accent}"/><ellipse cx="90" cy="40" rx="20" ry="18" fill="${c.bg2}"/><ellipse cx="80" cy="30" rx="6" ry="12" fill="${c.accent}"/><ellipse cx="100" cy="30" rx="6" ry="12" fill="${c.accent}"/><circle cx="85" cy="38" r="3" fill="${c.fg}"/><circle cx="95" cy="38" r="3" fill="${c.fg}"/><ellipse cx="90" cy="48" rx="6" ry="4" fill="${c.fg}"/></svg>`;
    const svgCat = (c) => `<svg viewBox="0 0 120 80"><ellipse cx="60" cy="45" rx="32" ry="22" fill="${c.accent}"/><ellipse cx="90" cy="42" rx="18" ry="16" fill="${c.bg2}"/><polygon points="78,26 72,8 85,25" fill="${c.muted}"/><polygon points="102,26 108,8 95,25" fill="${c.muted}"/><circle cx="85" cy="40" r="3" fill="${c.fg}"/><circle cx="95" cy="40" r="3" fill="${c.fg}"/><ellipse cx="90" cy="48" rx="3" ry="2" fill="${c.fg}"/></svg>`;
    const svgBird = (c) => `<svg viewBox="0 0 120 80"><ellipse cx="60" cy="45" rx="25" ry="28" fill="${c.accent}"/><ellipse cx="85" cy="35" rx="15" ry="15" fill="${c.muted}"/><path d="M98 35 L112 38 L98 42 Z" fill="${c.border}"/><circle cx="85" cy="32" r="3" fill="${c.eye}"/><ellipse cx="60" cy="45" rx="15" ry="20" fill="${c.bg2}"/></svg>`;
    const svgFish = (c) => `<svg viewBox="0 0 120 80"><ellipse cx="60" cy="45" rx="30" ry="20" fill="${c.accent}"/><polygon points="32,45 15,30 15,60" fill="${c.muted}"/><polygon points="60,25 50,10 70,25" fill="${c.border}"/><circle cx="80" cy="40" r="3" fill="${c.fg}"/></svg>`;
    const svgSnake = (c) => `<svg viewBox="0 0 120 80"><path d="M20 50 Q40 20 60 50 T100 50" stroke="${c.accent}" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M20 50 Q40 20 60 50 T100 50" stroke="${c.border}" stroke-width="4" fill="none" stroke-dasharray="6,4"/><circle cx="95" cy="48" r="3" fill="${c.fg}"/></svg>`;
    const svgMammal = (c) => `<svg viewBox="0 0 120 80"><ellipse cx="60" cy="50" rx="35" ry="22" fill="${c.accent}"/><circle cx="90" cy="40" r="18" fill="${c.bg2}"/><circle cx="82" cy="28" r="6" fill="${c.muted}"/><circle cx="98" cy="28" r="6" fill="${c.muted}"/><circle cx="85" cy="38" r="3" fill="${c.fg}"/><circle cx="95" cy="38" r="3" fill="${c.fg}"/><ellipse cx="90" cy="45" rx="4" ry="2" fill="${c.fg}"/></svg>`;

    // Helper to generate full theme entries with optional eyeColor support
    function t(bg, bg2, fg, muted, accent, border, type, eyeColor = null) {
      let r = parseInt(accent.slice(1, 3), 16), g = parseInt(accent.slice(3, 5), 16), b = parseInt(accent.slice(5, 7), 16);
      return { 
        colors: { bg, bg2, fg, muted, accent, border, glow: `rgba(${r}, ${g}, ${b}, 0.3)`, eye: eyeColor || fg }, 
        type 
      };
    }

    // --- Mega Theme Database ---
    const themes = {
      lizard: {
        'Standard Bearded Dragon': t('#FDF6E3', '#F5E6C8', '#2D1B0E', '#8B7355', '#E07B39', '#D4A574', 'lizard'),
        'Red Dragon': t('#FFEBEE', '#FFCDD2', '#4A1A1A', '#8B4545', '#D32F2F', '#EF9A9A', 'lizard'),
        'Citrus Dragon': t('#FFFDE7', '#FFF9C4', '#5D4037', '#8D6E63', '#FBC02D', '#FFF176', 'lizard'),
        'Komodo Dragon': t('#EFEBE9', '#D7CCC8', '#3E2723', '#5D4037', '#4E342E', '#BCAAA4', 'lizard'),
        'Leopard Gecko': t('#FFF8E1', '#FFECB3', '#4E342E', '#F57F17', '#FFCA28', '#FFE082', 'lizard')
      },
      turtle: {
        'Sea Turtle': t('#E0F7FA', '#B2EBF2', '#004D40', '#00897B', '#00838F', '#80DEEA', 'turtle'),
        'Box Turtle': t('#FFF8E1', '#FFECB3', '#5D4037', '#795548', '#FF8F00', '#FFCC80', 'turtle'),
        'Painted Turtle': t('#FAFAFA', '#F5F5F5', '#212121', '#757575', '#D32F2F', '#E0E0E0', 'turtle'),
        'Loggerhead Sea Turtle': t('#EFEBE9', '#D7CCC8', '#3E2723', '#6D4C41', '#8D6E63', '#A1887F', 'turtle'),
        'Hawksbill Sea Turtle': t('#FFF3E0', '#FFE0B2', '#4E342E', '#8D6E63', '#F57C00', '#FFB74D', 'turtle'),
        'Ridley Sea Turtle': t('#ECEFF1', '#CFD8DC', '#263238', '#546E7A', '#78909C', '#B0BEC5', 'turtle'),

    // Mapping icons
    const iconGenerators = {
      lizard: svgLizard, turtle: svgTurtle, dog: svgDog, cat: svgCat,
      bird: svgBird, fish: svgFish, snake: svgSnake, mammal: svgMammal
    };

    // Game State
    var gameState = {
      team1: { score: 0, fouls: 0, timeouts: 3, penalties: [0,0,0,0,0] },
      team2: { score: 0, fouls: 0, timeouts: 3, penalties: [0,0,0,0,0] },
      period: 1,
      gameFormat: 'quarters', // quarters, halves, periods, innings
      gameTimerSeconds: 720,
      shotClockSeconds: 24,
      shotClockActive: true,
      penaltiesActive: false,
      timerRunning: false,
      timerInterval: null
    };

    // DOM References
    var team1ScoreEl = document.getElementById('team1-score');
    var team2ScoreEl = document.getElementById('team2-score');
    var team1FoulsEl = document.getElementById('team1-fouls');
    var team2FoulsEl = document.getElementById('team2-fouls');
    var team1TimeoutDots = document.getElementById('team1-timeouts-dots');
    var team2TimeoutDots = document.getElementById('team2-timeouts-dots');
    var gameTimerEl = document.getElementById('game-timer');
    var shotClockEl = document.getElementById('shotclock');
    var resetModal = document.getElementById('reset-modal');
    var categorySelect = document.getElementById('category-select');
    var breedSelect = document.getElementById('breed-select');
    var iconContainer = document.getElementById('animal-icon-container');
    var titleText = document.getElementById('title-text');
    var gameFormatSelect = document.getElementById('game-format');
    var periodContainer = document.getElementById('period-container');
    var shotclockToggleBtn = document.getElementById('shotclock-toggle');

    // Theme Logic
    function populateBreeds() {
      var category = categorySelect.value;
      var breeds = Object.keys(themes[category]);
      breedSelect.innerHTML = '';
      breeds.forEach(function(breed) {
        var option = document.createElement('option');
        option.value = breed;
        option.textContent = breed;
        breedSelect.appendChild(option);
      });
      applyTheme();
    }

    function applyTheme() {
      var category = categorySelect.value;
      var breed = breedSelect.value;
      
      if (!themes[category] || !themes[category][breed]) return;
      
      var themeData = themes[category][breed];
      var colors = themeData.colors;
      
      document.documentElement.style.setProperty('--bg', colors.bg);
      document.documentElement.style.setProperty('--bg-secondary', colors.bg2);
      document.documentElement.style.setProperty('--fg', colors.fg);
      document.documentElement.style.setProperty('--muted', colors.muted);
      document.documentElement.style.setProperty('--accent', colors.accent);
      document.documentElement.style.setProperty('--border', colors.border);
      document.documentElement.style.setProperty('--glow', colors.glow);
      
      var generator = iconGenerators[themeData.type] || iconGenerators.mammal;
      iconContainer.innerHTML = generator(colors);
      titleText.textContent = breed;
    }

    categorySelect.addEventListener('change', populateBreeds);
    breedSelect.addEventListener('change', applyTheme);

    // Timer Functions
    function formatTime(seconds) {
      var mins = Math.floor(seconds / 60);
      var secs = seconds % 60;
      return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function updateTimerDisplay() {
      gameTimerEl.textContent = formatTime(gameState.gameTimerSeconds);
    }

    function updateShotClockDisplay() {
      if (gameState.shotClockActive) {
        shotClockEl.textContent = gameState.shotClockSeconds;
      } else {
        shotClockEl.textContent = '--';
      }
    }

    function startTimer() {
      if (gameState.timerRunning) return;
      gameState.timerRunning = true;
      gameTimerEl.classList.add('timer-running');
      
      gameState.timerInterval = setInterval(function() {
        if (gameState.gameTimerSeconds > 0) {
          gameState.gameTimerSeconds--;
          updateTimerDisplay();
          if (gameState.shotClockSeconds > 0 && gameState.shotClockActive) {
            gameState.shotClockSeconds--;
            updateShotClockDisplay();
          }
          if (gameState.gameTimerSeconds === 0) stopTimer();
        }
      }, 1000);
    }

    function stopTimer() {
      gameState.timerRunning = false;
      gameTimerEl.classList.remove('timer-running');
      if (gameState.timerInterval) {
        clearInterval(gameState.timerInterval);
        gameState.timerInterval = null;
      }
    }

    document.getElementById('timer-start').addEventListener('click', startTimer);
    document.getElementById('timer-stop').addEventListener('click', stopTimer);
    
    // Custom Time Set
    document.getElementById('timer-set').addEventListener('click', function() {
      var input = prompt("Enter custom time in MM:SS format (e.g., 10:00 or 15:30):", formatTime(gameState.gameTimerSeconds));
      if (input) {
        var parts = input.split(':');
        if (parts.length === 2) {
          var m = parseInt(parts[0], 10);
          var s = parseInt(parts[1], 10);
          if (!isNaN(m) && !isNaN(s)) {
            gameState.gameTimerSeconds = (m * 60) + s;
            updateTimerDisplay();
          }
        } else if (parts.length === 1) {
          var m = parseInt(parts[0], 10);
          if (!isNaN(m)) {
            gameState.gameTimerSeconds = m * 60;
            updateTimerDisplay();
          }
        }
      }
    });

    // Shot Clock Controls
    document.getElementById('shotclock-reset').addEventListener('click', function() {
      if(gameState.shotClockActive) {
        gameState.shotClockSeconds = 24;
        updateShotClockDisplay();
      }
    });

    document.getElementById('shotclock-14').addEventListener('click', function() {
      if(gameState.shotClockActive) {
        gameState.shotClockSeconds = 14;
        updateShotClockDisplay();
      }
    });

    shotclockToggleBtn.addEventListener('click', function() {
      gameState.shotClockActive = !gameState.shotClockActive;
      if (gameState.shotClockActive) {
        this.textContent = 'Off';
        this.classList.replace('btn-success', 'btn-danger');
      } else {
        this.textContent = 'On';
        this.classList.replace('btn-danger', 'btn-success');
      }
      updateShotClockDisplay();
    });

    // Period Controls
    function renderPeriods() {
      periodContainer.innerHTML = '';
      let formatArr = [];
      if (gameState.gameFormat === 'quarters') formatArr = ['1', '2', '3', '4', 'OT'];
      else if (gameState.gameFormat === 'halves') formatArr = ['1', '2', 'OT'];
      else if (gameState.gameFormat === 'periods') formatArr = ['1', '2', '3', 'OT'];
      else if (gameState.gameFormat === 'innings') formatArr = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'EX'];

      formatArr.forEach((p, index) => {
        let div = document.createElement('div');
        div.className = 'period-indicator';
        div.textContent = p;
        if (index + 1 === gameState.period) div.classList.add('active');
        periodContainer.appendChild(div);
      });
    }

    function updatePeriodDisplay() {
      let limit = 0;
      if (gameState.gameFormat === 'quarters') limit = 5;
      if (gameState.gameFormat === 'halves') limit = 3;
      if (gameState.gameFormat === 'periods') limit = 4;
      if (gameState.gameFormat === 'innings') limit = 10;
      
      if (gameState.period > limit) gameState.period = limit;
      renderPeriods();
    }

    gameFormatSelect.addEventListener('change', function(e) {
      gameState.gameFormat = e.target.value;
      gameState.period = 1;
      updatePeriodDisplay();
    });

    document.getElementById('period-prev').addEventListener('click', function() {
      if (gameState.period > 1) { gameState.period--; updatePeriodDisplay(); }
    });

    document.getElementById('period-next').addEventListener('click', function() {
      let limit = 0;
      if (gameState.gameFormat === 'quarters') limit = 5;
      if (gameState.gameFormat === 'halves') limit = 3;
      if (gameState.gameFormat === 'periods') limit = 4;
      if (gameState.gameFormat === 'innings') limit = 10;
      
      if (gameState.period < limit) { gameState.period++; updatePeriodDisplay(); }
    });

    // Penalty Shootout Controls
    function renderPenalties() {
      [1, 2].forEach(team => {
        let container = document.getElementById('team' + team + '-penalties');
        container.innerHTML = '';
        gameState['team' + team].penalties.forEach((val, i) => {
          let d = document.createElement('div');
          d.className = 'pk-dot' + (val === 1 ? ' made' : (val === 2 ? ' missed' : ''));
          d.onclick = () => cyclePenalty(team, i);
          container.appendChild(d);
        });
      });
    }

    function cyclePenalty(team, index) {
      let p = gameState['team' + team].penalties;
      p[index] = (p[index] + 1) % 3;
      renderPenalties();
    }

    function addPenalty(team) {
      gameState['team' + team].penalties.push(0);
      renderPenalties();
    }

    document.getElementById('penalty-toggle').addEventListener('click', function() {
      gameState.penaltiesActive = !gameState.penaltiesActive;
      this.textContent = 'Penalty Shootout: ' + (gameState.penaltiesActive ? 'On' : 'Off');
      this.classList.toggle('btn-primary', gameState.penaltiesActive);
      this.classList.toggle('btn-secondary', !gameState.penaltiesActive);
      
      document.getElementById('team1-penalties-container').classList.toggle('hidden', !gameState.penaltiesActive);
      document.getElementById('team2-penalties-container').classList.toggle('hidden', !gameState.penaltiesActive);
      
      if(gameState.penaltiesActive) renderPenalties();
    });

    // Score Functions
    function changeScore(team, delta) {
      var key = 'team' + team;
      gameState[key].score = Math.max(0, gameState[key].score + delta);
      document.getElementById(key + '-score').textContent = gameState[key].score;
    }

    // Foul Functions
    function changeFouls(team, delta) {
      var key = 'team' + team;
      gameState[key].fouls = Math.max(0, gameState[key].fouls + delta);
      document.getElementById(key + '-fouls').textContent = gameState[key].fouls;
    }

    // Timeout Functions
    function updateTimeoutDots(team) {
      var key = 'team' + team;
      var dots = document.getElementById(key + '-timeouts-dots').children;
      var remaining = gameState[key].timeouts;
      for (var i = 0; i < dots.length; i++) {
        if (i < remaining) dots[i].classList.remove('used');
        else dots[i].classList.add('used');
      }
    }

    function changeTimeouts(team, delta) {
      var key = 'team' + team;
      gameState[key].timeouts = Math.max(0, Math.min(3, gameState[key].timeouts + delta));
      updateTimeoutDots(team);
    }

    // Clear Functions
    function clearTeamStat(team, stat) {
      var key = 'team' + team;
      if (stat === 'score') { gameState[key].score = 0; document.getElementById(key + '-score').textContent = '0'; }
      else if (stat === 'fouls') { gameState[key].fouls = 0; document.getElementById(key + '-fouls').textContent = '0'; }
      else if (stat === 'timeouts') { gameState[key].timeouts = 3; updateTimeoutDots(team); }
      else if (stat === 'penalties') { gameState[key].penalties = [0,0,0,0,0]; renderPenalties(); }
    }

    function clearAllScores() {
      gameState.team1.score = 0; gameState.team2.score = 0;
      team1ScoreEl.textContent = '0'; team2ScoreEl.textContent = '0';
    }

    function clearAllFouls() {
      gameState.team1.fouls = 0; gameState.team2.fouls = 0;
      team1FoulsEl.textContent = '0'; team2FoulsEl.textContent = '0';
    }

    function clearAllTimeouts() {
      gameState.team1.timeouts = 3; gameState.team2.timeouts = 3;
      updateTimeoutDots(1); updateTimeoutDots(2);
    }

    function clearPeriod() { gameState.period = 1; updatePeriodDisplay(); }
    function clearTimer() { stopTimer(); gameState.gameTimerSeconds = 720; updateTimerDisplay(); }
    function clearShotClock() { gameState.shotClockSeconds = 24; updateShotClockDisplay(); }

    // Master Reset
    function showResetModal() { resetModal.classList.add('active'); }
    function closeResetModal() { resetModal.classList.remove('active'); }

    function resetAll() {
      stopTimer();
      gameState.team1 = { score: 0, fouls: 0, timeouts: 3, penalties: [0,0,0,0,0] };
      gameState.team2 = { score: 0, fouls: 0, timeouts: 3, penalties: [0,0,0,0,0] };
      gameState.period = 1;
      gameState.gameTimerSeconds = 720;
      if(gameState.shotClockActive) {
        gameState.shotClockSeconds = 24;
      }
      
      team1ScoreEl.textContent = '0'; team2ScoreEl.textContent = '0';
      team1FoulsEl.textContent = '0'; team2FoulsEl.textContent = '0';
      updateTimeoutDots(1); updateTimeoutDots(2);
      if (gameState.penaltiesActive) renderPenalties();
      updatePeriodDisplay(); updateTimerDisplay(); updateShotClockDisplay();
      closeResetModal();
    }

    resetModal.addEventListener('click', function(e) { if (e.target === resetModal) closeResetModal(); });

    // Initialize
    populateBreeds();
    updateTimerDisplay();
    updateShotClockDisplay();
    updatePeriodDisplay();
    updateTimeoutDots(1);
    updateTimeoutDots(2);
    renderPenalties();
  </script>
</body>
</html>
